<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mood DJ</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; width: 330px; background: #181818; color: #fff; font: 14px Roboto, Arial, sans-serif; color-scheme: dark; }
  .wrap { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .logo { width: 28px; height: 28px; border-radius: 14px; background: #cc0000; display: flex; align-items: center; justify-content: center; flex: none; }
  .brand { font-weight: 700; font-size: 16px; }
  .status { margin-left: auto; font-size: 12px; color: #aaaaaa; }
  .now { display: flex; gap: 12px; align-items: center; }
  .art { width: 56px; height: 56px; border-radius: 6px; background: #2a2a2a; overflow: hidden; flex: none; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist, .muted { font-size: 12px; color: #aaaaaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { white-space: normal; line-height: 1.4; }
  .seek { display: flex; align-items: center; gap: 8px; }
  .tm { font-size: 11px; color: #aaaaaa; min-width: 36px; font-variant-numeric: tabular-nums; }
  .tm:last-child { text-align: right; }
  input[type=range] { accent-color: #ff3b3b; margin: 0; height: 20px; cursor: pointer; }
  #seek { flex: 1; min-width: 0; }
  .ctrls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .volbox { display: flex; align-items: center; }
  #vol { width: 70px; }
  .transport { display: flex; align-items: center; gap: 4px; }
  .icon { width: 40px; height: 40px; border: none; background: transparent; color: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon:hover { background: #2a2a2a; }
  .play { width: 48px; height: 48px; border-radius: 24px; border: none; background: #fff; color: #0f0f0f; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .like { justify-self: end; }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; height: 38px; border-radius: 19px; border: 1px solid #4a4a4a; background: #2a2a2a; color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn.primary { border: none; background: #cc0000; font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ff3b3b; outline-offset: 1px; }
  svg { display: block; }
  .links { display: flex; justify-content: center; gap: 14px; font-size: 12px; }
  .links a { color: #aaaaaa; }
  /* Thème « gloss », comme le panneau. */
  body { background: linear-gradient(160deg, #222228, #121216); }
  .logo { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.06) 48%, rgba(255,255,255,0) 52%), linear-gradient(135deg, #ff3d3d, #cc0000); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 12px rgba(204,0,0,.45); }
  .art { border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.45); }
  .btn { background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.04) 48%, rgba(255,255,255,0) 52%), rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 8px rgba(0,0,0,.25); }
  .btn.primary { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.06) 48%, rgba(255,255,255,0) 52%), linear-gradient(135deg, #ff3d3d, #cc0000); border: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px rgba(204,0,0,.4); }
  .play { background: radial-gradient(circle at 50% 30%, #fff, #e9e9ee 60%, #cfcfd6); box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(0,0,0,.45); }
  .icon:hover { background: rgba(255,255,255,.08); }
  input[type=range] { accent-color: #ff0000; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="2.5"></circle></svg></div>
    <span class="brand">Mood DJ</span>
    <span class="status" id="status"></span>
  </div>

  <div id="none" hidden>
    <p class="muted">YouTube Music n'est ouvert dans aucun onglet.</p>
    <button class="btn primary" type="button" id="open">Ouvrir YouTube Music</button>
  </div>

  <div id="player" hidden>
    <div class="now">
      <div class="art"><img id="art" alt=""></div>
      <div class="text">
        <span class="title" id="title"></span>
        <span class="artist" id="artist"></span>
        <span class="artist" id="next"></span>
      </div>
    </div>
    <div class="seek">
      <span class="tm" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-label="Position dans le titre">
      <span class="tm" id="rem"></span>
    </div>
    <div class="ctrls">
      <div class="volbox">
        <button class="icon" type="button" id="mute" aria-label="Couper le son"></button>
        <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="Volume">
      </div>
      <div class="transport">
        <button class="icon" type="button" id="prev" aria-label="Titre précédent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L9 12z"></path></svg></button>
        <button class="play" type="button" id="toggle" aria-label="Lecture"></button>
        <button class="icon" type="button" id="nextbtn" aria-label="Titre suivant"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5v14l10-7z"></path></svg></button>
      </div>
      <button class="icon like" type="button" id="like" aria-label="J'aime" aria-pressed="false"></button>
    </div>
    <div class="btns">
      <button class="btn" type="button" id="panel">Afficher le panneau</button>
      <button class="btn" type="button" id="stop" hidden>Arrêter Mood DJ</button>
    </div>
  </div>
  <div class="links">
    <a href="options.html" target="_blank" rel="noopener">Clés API</a>
    <a href="legal.html" target="_blank" rel="noopener">Mentions légales et confidentialité</a>
  </div>
</div>
<script src="i18n-en.js"></script>
<script src="i18n-page.js"></script>
<script src="popup.js"></script>
</body>
</html>
